# Secrets overlay for compose.prod.yaml (project skriptoteket).
#
# Every value below is a guarded interpolation: the ${VAR:?...} guard fails any
# compose verb that loads this file while VAR is unset or empty, so ps, logs,
# stop, config, exec and boot paths run on compose.prod.yaml alone and never
# read a secret. Production deploys and recreates run only through
# `pdm run hemma-deploy` or `pdm run hemma-deploy-share-previews`; ps, logs
# and stop use compose.prod.yaml alone.
---
services:
  web:
    environment:
      DATABASE_URL: postgresql+asyncpg://skriptoteket:${SKRIPTOTEKET_DB_PASSWORD:?run through agent-secrets run --set skriptoteket-prod}@shared-postgres:5432/skriptoteket
      SECRET_KEY: ${SECRET_KEY:?run through agent-secrets run --set skriptoteket-prod}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:?run through agent-secrets run --set skriptoteket-prod}
      # Door key shared by editor AI and the exam answer-key lane.
      HULEEDU_INTERNAL_API_KEY: ${HULEEDU_INTERNAL_API_KEY:?run through agent-secrets run --set skriptoteket-prod}
      SIR_CONVERT_A_LOT_V2_API_KEY: ${SIR_CONVERT_A_LOT_V2_API_KEY:?run through agent-secrets run --set skriptoteket-prod}

  worker:
    environment:
      DATABASE_URL: postgresql+asyncpg://skriptoteket:${SKRIPTOTEKET_DB_PASSWORD:?run through agent-secrets run --set skriptoteket-prod}@shared-postgres:5432/skriptoteket
      # Keep the door and converter credentials identical to web.
      HULEEDU_INTERNAL_API_KEY: ${HULEEDU_INTERNAL_API_KEY:?run through agent-secrets run --set skriptoteket-prod}
      SIR_CONVERT_A_LOT_V2_API_KEY: ${SIR_CONVERT_A_LOT_V2_API_KEY:?run through agent-secrets run --set skriptoteket-prod}
