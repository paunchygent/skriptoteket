# Secrets overlay for compose.hemma-dev.yaml (project skriptoteket-dev).
#
# Every value below is a guarded interpolation: the ${VAR:?...} guard fails any
# compose verb that loads this file while VAR is unset or empty, so status,
# stop and other non-up paths run on compose.hemma-dev.yaml alone and never
# read a secret. `pdm run hemma-dev` passes this file only on up/run paths,
# wrapped by `agent-secrets run --set skriptoteket-staging`.
---
services:
  db:
    environment:
      POSTGRES_PASSWORD: ${SKRIPTOTEKET_DEV_DB_PASSWORD:?run through agent-secrets run --set skriptoteket-staging}

  web:
    environment:
      DATABASE_URL: "postgresql+asyncpg://skriptoteket:${SKRIPTOTEKET_DEV_DB_PASSWORD:?run through agent-secrets run --set skriptoteket-staging}@db:5432/skriptoteket"
      HULEEDU_INTERNAL_API_KEY: ${HULEEDU_INTERNAL_API_KEY:?run through agent-secrets run --set skriptoteket-staging}

  worker:
    environment:
      DATABASE_URL: "postgresql+asyncpg://skriptoteket:${SKRIPTOTEKET_DEV_DB_PASSWORD:?run through agent-secrets run --set skriptoteket-staging}@db:5432/skriptoteket"
      HULEEDU_INTERNAL_API_KEY: ${HULEEDU_INTERNAL_API_KEY:?run through agent-secrets run --set skriptoteket-staging}
