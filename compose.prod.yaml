---
# Production deployment for home server (hemma.hule.education)
# Usage:
#   docker compose -f compose.prod.yaml build
#   docker compose -f compose.prod.yaml up -d
#
# Prerequisites:
# - External network: docker network create hule-network
# - External PostgreSQL: shared-postgres on hule-network
# - Environment variables in .env (see .env.example.prod)

name: skriptoteket

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: skriptoteket-web:latest
    container_name: skriptoteket-web
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+asyncpg://skriptoteket:${SKRIPTOTEKET_DB_PASSWORD}@shared-postgres:5432/skriptoteket
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: production
      COOKIE_SECURE: "true"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,::1,skriptoteket.hule.education}
      PUBLIC_APP_BASE_URL: ${PUBLIC_APP_BASE_URL:-https://skriptoteket.hule.education}
      # Uvicorn owns the single trusted-proxy chain: it resolves the client from
      # X-Forwarded-For against FORWARDED_ALLOW_IPS and the app uses that peer
      # directly. Never pass a wildcard; without the exact nginx-proxy CIDR only
      # loopback is trusted, so every caller collapses to the proxy address.
      FORWARDED_ALLOW_IPS: ${TRUSTED_PROXY_CIDRS:-127.0.0.1}
      # HuleEdu Gateway signed internal identity verification for
      # protected app APIs.
      HULEEDU_INTERNAL_IDENTITY_PUBLIC_KEY_PATH: ${HULEEDU_INTERNAL_IDENTITY_PUBLIC_KEY_PATH:-/run/huleedu/internal-identity/gateway-internal-identity-public-key.pem}
      HULEEDU_INTERNAL_IDENTITY_SIGNING_KEY_ID: ${HULEEDU_INTERNAL_IDENTITY_SIGNING_KEY_ID:-gateway-identity-rs256-v1}
      HULEEDU_INTERNAL_IDENTITY_ISSUER: ${HULEEDU_INTERNAL_IDENTITY_ISSUER:-api_gateway_service}
      HULEEDU_INTERNAL_IDENTITY_AUDIENCE: ${HULEEDU_INTERNAL_IDENTITY_AUDIENCE:-skriptoteket}
      RUNNER_IMAGE: skriptoteket-runner:latest
      RUNNER_QUEUE_ENABLED: "true"
      ARTIFACTS_ROOT: /app/.artifacts
      VAULT_ROOT: /var/lib/skriptoteket/vault
      MEDIA_ROOT: /var/lib/skriptoteket/media
      # Observability (requires compose.observability.yaml running)
      OTEL_TRACING_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      SERVICE_VERSION: "0.2.0"
      # Email (SMTP)
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-mail.privateemail.com}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USERNAME: ${EMAIL_SMTP_USERNAME:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_SMTP_USE_TLS: ${EMAIL_SMTP_USE_TLS:-true}
      EMAIL_SMTP_TIMEOUT: ${EMAIL_SMTP_TIMEOUT:-30}
      EMAIL_DEFAULT_FROM_EMAIL: ${EMAIL_DEFAULT_FROM_EMAIL:-noreply@hule.education}
      EMAIL_DEFAULT_FROM_NAME: ${EMAIL_DEFAULT_FROM_NAME:-Skriptoteket}
      HEALTHZ_SMTP_CHECK_ENABLED: ${HEALTHZ_SMTP_CHECK_ENABLED:-true}
      HEALTHZ_DETAILED_RESPONSE: ${HEALTHZ_DETAILED_RESPONSE:-false}
      METRICS_IDENTITY_GAUGES_ENABLED: ${METRICS_IDENTITY_GAUGES_ENABLED:-false}
      EMAIL_VERIFICATION_BASE_URL: ${EMAIL_VERIFICATION_BASE_URL:-https://skriptoteket.hule.education}
      EMAIL_VERIFICATION_TTL_HOURS: ${EMAIL_VERIFICATION_TTL_HOURS:-24}
      # Editor AI (completion, chat, chat ops) and exam AI go through the HuleEdu LLM provider door.
      LLM_COMPLETION_ENABLED: ${LLM_COMPLETION_ENABLED:-false}
      LLM_COMPLETION_MODEL: ${LLM_COMPLETION_MODEL:-gpt-6-luna}
      LLM_COMPLETION_REASONING_EFFORT: ${LLM_COMPLETION_REASONING_EFFORT:-none}
      LLM_CHAT_ENABLED: ${LLM_CHAT_ENABLED:-false}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-gpt-6.1-sol}
      LLM_CHAT_REASONING_EFFORT: ${LLM_CHAT_REASONING_EFFORT:-low}
      LLM_CHAT_TEMPLATE_ID: ${LLM_CHAT_TEMPLATE_ID:-editor_chat_v1}
      LLM_CHAT_TIMEOUT_SECONDS: ${LLM_CHAT_TIMEOUT_SECONDS:-120}
      LLM_CHAT_OPS_ENABLED: ${LLM_CHAT_OPS_ENABLED:-false}
      LLM_CHAT_OPS_MODEL: ${LLM_CHAT_OPS_MODEL:-gpt-6.1-sol}
      LLM_CHAT_OPS_REASONING_EFFORT: ${LLM_CHAT_OPS_REASONING_EFFORT:-low}
      LLM_CHAT_OPS_TEMPLATE_ID: ${LLM_CHAT_OPS_TEMPLATE_ID:-editor_chat_ops_v1}
      LLM_CHAT_OPS_TIMEOUT_SECONDS: ${LLM_CHAT_OPS_TIMEOUT_SECONDS:-120}
      # Exam answer-key enablement; door address and key (shared with the editor AI above).
      LLM_ANSWER_KEY_ENABLED: ${LLM_ANSWER_KEY_ENABLED:-false}
      HULEEDU_LLM_PROVIDER_BASE_URL: ${HULEEDU_LLM_PROVIDER_BASE_URL:-http://huleedu_llm_provider_service:8080}
      HULEEDU_INTERNAL_API_KEY: ${HULEEDU_INTERNAL_API_KEY:-}
      # Conversion Hub -> Sir Convert-a-Lot v2
      SIR_CONVERT_A_LOT_V2_BASE_URL: ${SIR_CONVERT_A_LOT_V2_BASE_URL:-http://sir_convert_a_lot_prod:8085}
      SIR_CONVERT_A_LOT_V2_API_KEY: ${SIR_CONVERT_A_LOT_V2_API_KEY:-}
      SIR_CONVERT_A_LOT_V2_CALLBACK_BASE_URL: ${SIR_CONVERT_A_LOT_V2_CALLBACK_BASE_URL:-https://skriptoteket.hule.education}
      SIR_CONVERT_A_LOT_V2_TIMEOUT_SECONDS: ${SIR_CONVERT_A_LOT_V2_TIMEOUT_SECONDS:-60}
      # nginx-proxy integration
      VIRTUAL_HOST: skriptoteket.hule.education
      VIRTUAL_PORT: "8000"
      LETSENCRYPT_HOST: skriptoteket.hule.education
    expose:
      - "8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - artifacts_data:/app/.artifacts
      - vault_data:/var/lib/skriptoteket/vault
      # Tutorial media; the HuleFilm publish step creates this directory.
      - /home/paunchygent/apps/skriptoteket-media/prod:/var/lib/skriptoteket/media:ro
      - /home/paunchygent/models/skriptoteket/reagent_prep_chef/sds_pdfs:/var/lib/skriptoteket/reagent_prep_chef/sds_pdfs
      - ${HULEEDU_INTERNAL_IDENTITY_PUBLIC_KEY_HOST_DIR:-/home/paunchygent/apps/huledu/secrets/hemma-runtime/internal-identity}:/run/huleedu/internal-identity:ro
    networks:
      - hule-network
    healthcheck:
      test:
        - CMD
        - /bin/sh
        - /app/src/skriptoteket/cli/commands/healthcheck_web.sh
        - http://localhost:8000/healthz/live
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  worker:
    image: skriptoteket-web:latest
    container_name: skriptoteket-worker
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+asyncpg://skriptoteket:${SKRIPTOTEKET_DB_PASSWORD}@shared-postgres:5432/skriptoteket
      ENVIRONMENT: production
      SERVICE_NAME: skriptoteket-worker
      RUNNER_IMAGE: skriptoteket-runner:latest
      RUNNER_QUEUE_ENABLED: "true"
      ARTIFACTS_ROOT: /app/.artifacts
      VAULT_ROOT: /var/lib/skriptoteket/vault
      PYTHONPATH: /app/src
      # Observability (requires compose.observability.yaml running)
      OTEL_TRACING_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      # Keep answer-key provider enablement and door credentials identical to web.
      LLM_ANSWER_KEY_ENABLED: ${LLM_ANSWER_KEY_ENABLED:-false}
      HULEEDU_LLM_PROVIDER_BASE_URL: ${HULEEDU_LLM_PROVIDER_BASE_URL:-http://huleedu_llm_provider_service:8080}
      HULEEDU_INTERNAL_API_KEY: ${HULEEDU_INTERNAL_API_KEY:-}
      # Keep worker runtime on the same canonical Sir Convert v2 env
      # contract as web
      # so queue/CLI flows never depend on stale aliases or partial recreates.
      SIR_CONVERT_A_LOT_V2_BASE_URL: ${SIR_CONVERT_A_LOT_V2_BASE_URL:-http://sir_convert_a_lot_prod:8085}
      SIR_CONVERT_A_LOT_V2_API_KEY: ${SIR_CONVERT_A_LOT_V2_API_KEY:-}
      SIR_CONVERT_A_LOT_V2_CALLBACK_BASE_URL: ${SIR_CONVERT_A_LOT_V2_CALLBACK_BASE_URL:-https://skriptoteket.hule.education}
      SIR_CONVERT_A_LOT_V2_TIMEOUT_SECONDS: ${SIR_CONVERT_A_LOT_V2_TIMEOUT_SECONDS:-60}
    command:
      - pdm
      - run
      - python
      - -m
      - skriptoteket.cli
      - run-execution-worker
      - --queue
      - default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - artifacts_data:/app/.artifacts
      - vault_data:/var/lib/skriptoteket/vault
      - /home/paunchygent/models/skriptoteket/reagent_prep_chef/sds_pdfs:/var/lib/skriptoteket/reagent_prep_chef/sds_pdfs
    networks:
      - hule-network
    healthcheck:
      test:
        [
          "CMD",
          "/bin/sh",
          "/app/src/skriptoteket/cli/commands/healthcheck_execution_worker.sh",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Runner image - built but not run as a service
  # Web app starts runner containers dynamically via Docker API
  runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    image: skriptoteket-runner:latest
    profiles:
      - build-only

networks:
  hule-network:
    external: true

volumes:
  artifacts_data:
  vault_data:
