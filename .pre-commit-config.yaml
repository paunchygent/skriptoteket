default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml

  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff format (staged files)
        entry: pdm run ruff format --force-exclude
        language: system
        types: [python]
        pass_filenames: true

      - id: ruff-lint
        name: Ruff lint (staged files)
        entry: pdm run ruff check --force-exclude
        language: system
        types: [python]
        pass_filenames: true

      - id: mypy
        name: Mypy typecheck (src + tests)
        entry: pdm run typecheck
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: Pytest (targeted unit suite)
        entry: pdm run python -m scripts.run_precommit_targeted_unit_tests
        language: system
        types: [python]
        pass_filenames: true

      - id: shellcheck
        name: ShellCheck (staged shell scripts)
        entry: pdm run shellcheck
        language: system
        files: \.(sh|bash)$
        pass_filenames: true

      - id: docs-contract-validate
        name: Docs contract validate (placement + naming + frontmatter)
        entry: pdm run docs-validate
        language: system
        files: ^docs/
        pass_filenames: false

      - id: migration-test-coverage
        name: Migration test coverage
        entry: pdm run check-migration-test-coverage
        language: system
        files: ^(migrations/versions/.*\.py|tests/integration/test_migration_.*\.py|tests/integration/migration_schema_assertions\.py|scripts/check_migration_test_coverage\.py)$
        pass_filenames: false

      - id: reagent-hazard-shortcard-guard
        name: Reagent hazard↔shortcard guard
        entry: pdm run sds-check-hazard-alignment
        language: system
        files: ^(src/skriptoteket/infrastructure/curated_apps/apps/reagent_prep_chef/hazards\.json|data/reagent_prep_chef/sds/shortcards\.json|scripts/(align_reagent_prep_chef_hazard_codes_from_shortcards|check_reagent_prep_chef_hazard_shortcard_alignment)\.py|tests/unit/(scripts/test_(align|check)_reagent_prep_chef_hazard.*|infrastructure/curated_apps/apps/test_reagent_prep_chef_hazards_store\.py))
        pass_filenames: false

      - id: agent-doc-budgets
        name: Agent docs line budgets (.codex handoff -> long-term memory)
        entry: pdm run python -m scripts.check_agent_doc_budgets
        language: system
        files: ^\.codex/handoff\.md$
        pass_filenames: false

      - id: eslint
        name: ESLint (frontend)
        entry: pnpm --filter @skriptoteket/spa lint
        language: system
        files: ^frontend/apps/skriptoteket/src/.*\.(vue|ts|js)$
        pass_filenames: false
