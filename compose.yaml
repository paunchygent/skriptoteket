services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-skriptoteket}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - skriptoteket-db:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build:
      context: .
      target: development
    container_name: skriptoteket_web
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-skriptoteket}
      - PUBLIC_APP_BASE_URL=${PUBLIC_APP_BASE_URL:-http://localhost:5173}
      # Dev defaults:
      # - Inline completions: OpenAI primary (GPT-5) + local Devstral fallback.
      # - Chat/chat-ops: local Devstral primary + OpenAI fallback.
      - LLM_COMPLETION_BASE_URL=https://api.openai.com
      - LLM_COMPLETION_MODEL=gpt-5-nano
      - LLM_COMPLETION_REASONING_EFFORT=minimal
      - LLM_COMPLETION_FALLBACK_BASE_URL=http://host.docker.internal:8082
      - LLM_COMPLETION_FALLBACK_MODEL=Devstral-Small-2-24B
      - LLM_CHAT_BASE_URL=http://host.docker.internal:8082
      - LLM_CHAT_MODEL=Devstral-Small-2-24B
      - LLM_CHAT_CONTEXT_WINDOW_TOKENS=16384
      - LLM_CHAT_FALLBACK_BASE_URL=https://api.openai.com
      - LLM_CHAT_FALLBACK_MODEL=gpt-5.2
      - LLM_CHAT_FALLBACK_REASONING_EFFORT=low
      - LLM_CHAT_OPS_BASE_URL=http://host.docker.internal:8082
      - LLM_CHAT_OPS_MODEL=Devstral-Small-2-24B
      - LLM_CHAT_OPS_CONTEXT_WINDOW_TOKENS=16384
      - LLM_CHAT_OPS_FALLBACK_BASE_URL=https://api.openai.com
      - LLM_CHAT_OPS_FALLBACK_MODEL=gpt-5.2
      - LLM_CHAT_OPS_FALLBACK_REASONING_EFFORT=low
      - HULEEDU_INTERNAL_IDENTITY_PUBLIC_KEY_PATH=/run/huleedu/internal-identity/gateway-internal-identity-public-key.pem
      - HULEEDU_INTERNAL_IDENTITY_SIGNING_KEY_ID=gateway-identity-rs256-v1
      - HULEEDU_INTERNAL_IDENTITY_ISSUER=api_gateway_service
      - HULEEDU_INTERNAL_IDENTITY_AUDIENCE=skriptoteket
    volumes:
      - ./alembic.ini:/app/alembic.ini
      - ./migrations:/app/migrations
      - ./src:/app/src
      - ${HULEEDU_INTERNAL_IDENTITY_PUBLIC_KEY_HOST_PATH:-../../huleedu/secrets/local-runtime/internal-identity/gateway-internal-identity-public-key.pem}:/run/huleedu/internal-identity/gateway-internal-identity-public-key.pem:ro
      - vault_data:/var/lib/skriptoteket/vault
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      default:
      hule-network:
        aliases:
          - skriptoteket-web

  worker:
    build:
      context: .
      target: development
    container_name: skriptoteket_worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - SERVICE_NAME=skriptoteket-worker
      - PYTHONPATH=/app/src
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-skriptoteket}
    command:
      - pdm
      - run
      - python
      - -m
      - skriptoteket.cli
      - run-execution-worker
      - --queue
      - default
    depends_on:
      - db
    restart: unless-stopped
    volumes:
      - vault_data:/var/lib/skriptoteket/vault
    healthcheck:
      test:
        ["CMD", "pdm", "run", "python", "-m", "skriptoteket.cli", "healthcheck-execution-worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    image: node:22-slim
    working_dir: /app/frontend
    command: >
      sh -c "corepack enable
      && corepack prepare pnpm@latest --activate
      && pnpm install
      && pnpm --filter @skriptoteket/spa dev --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
      - VITE_DEV_HOST=0.0.0.0
      - VITE_DEV_PORT=5173
      - VITE_DEV_BACKEND_PROXY_TARGET=${VITE_DEV_BACKEND_PROXY_TARGET:-http://skriptoteket_web:8000}
      - VITE_DEV_PROXY_TARGET=${VITE_DEV_PROXY_TARGET:-http://huleedu_api_gateway_service:8080}
      - VITE_HULEEDU_AUTH_BASE_URL=${VITE_HULEEDU_AUTH_BASE_URL:-http://localhost:8080}
      - VITE_HULEEDU_AUTH_ENTRY_URL=${VITE_HULEEDU_AUTH_ENTRY_URL:-http://localhost:8080/auth/login}
    volumes:
      - ./frontend:/app/frontend
      - ./src:/app/src:cached
      - frontend_node_modules:/app/frontend/node_modules
    depends_on:
      - web
    restart: unless-stopped
    networks:
      default:
      hule-network:

networks:
  hule-network:
    external: true

volumes:
  skriptoteket-db:
  frontend_node_modules:
  vault_data:
