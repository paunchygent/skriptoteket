[project]
name = "hule-script-hub"
version = "0.2.0"
description = "Teacher-first Script Hub with FastAPI backend + Vue/Vite SPA and queue-backed Docker runner execution."
authors = [
    { name = "Olof Larsson", email = "paunchygent@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { text = "MIT" }

# Runtime dependencies for the web app + ingest pipeline + your preferred core libs.
dependencies = [
    # Config / settings
    "python-dotenv",
    "pydantic",
    "pydantic-settings",
    "structlog",

    # Web app (API + SPA hosting)
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "tldextract",

    # DI + persistence
    "dishka",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "docker",

    # Security
    "argon2-cffi",
    "cryptography>=46.0.0",

    # Email
    "aiosmtplib>=3.0",

    # Observability
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",

    # Tool registry + docs contract validation helpers
    "pyyaml",

    # Ingest / parsing
    "pandas",
    "openpyxl",
    "python-docx",
    "pypdf",
    "pdfplumber>=0.11.9",

    # Preferred core libs (kept in runtime since you want them broadly available)
    "aiohttp",
    "httpx",
    "psutil",
    "typer",
    "click",

    # Tokenizers / prompt budgeting (ST-08-27 / ADR-0055)
    "tiktoken>=0.12.0",
    "mistral-common>=1.5.6",
    "pypandoc",
    "weasyprint>=69.0",
    "playwright",
    "markdown>=3.6",
    "molmass>=2026.1.8",
    "starlette-dishka>=1.0.2",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
# Optional provider SDKs (install explicitly; prod images may opt in via `pdm install --prod -G llm`).
llm = [
    "google-genai>=1.49.0",
]

[dependency-groups]
# Repository tooling (lint/type/test/hooks + validation tooling)
monorepo-tools = [
    "repository-governance @ git+https://github.com/paunchygent/skill-repository.git@78c2ca3e9f2eebc27d980fd26bd1bfd04d9ea13d#subdirectory=packages/repository_governance",
    "ruff",
    "mypy",
    "pytest",
    "pytest-mock",
    "pytest-cov",
    "pytest-asyncio",
    "pytest-xdist",
    "pytest-timeout",
    "testcontainers",
    "pre-commit",
    "jsonschema",
    "pyyaml",
    "types-psutil",
    "pandas-stubs",
    "types-openpyxl>=3.1.5.20250919",
    "types-docker>=7.1.0.20251202",
    "types-requests>=2.32.4.20250913",
    "types-Markdown",
    "shellcheck-py",
    "types-xlrd>=2.0.0.20260518",
]

# "Dev everything" extras that are useful locally but not required in prod images.
dev = [
    "coverage>=7.9.2",
    "reportlab",
    "types-reportlab",
    "selenium",
    "requests",
    "beautifulsoup4",
    "rlPyCairo>=0.4.0",
    "cairocffi>=1.7.1",
]

analysis = [
    "numpy",
    "scipy",
    "pyarrow",
    "fastparquet",
    "matplotlib",
    "plotly",
    "tabulate",
    "types-tabulate",
]

tui = [
    "textual",
    "textual-filedrop",
    "crossfiledialog",
]

docs = [
    # If you later choose to publish docs as a site; keep optional to avoid forcing mkdocs.
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    ".git",
    ".venv",
    ".cache",
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".pdm-python",
    ".pdm-build",
    "dist",
    "build",
    "jupyter_scripts",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
]
ignore = [
    "E203",  # whitespace before ':' (conflicts with black)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
# Intentional re-exports
"src/**/__init__.py" = ["F401"]

# Scripts may prefer pragmatic patterns
"scripts/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
explicit_package_bases = true
namespace_packages = true
plugins = ["pydantic.mypy"]

# Typical src-layout
mypy_path = "src:stubs"
exclude = [
    "^scripts/",
    "docs/",
]

[[tool.mypy.overrides]]
module = ["scripts", "scripts.*"]
follow_imports = "skip"

# External libraries without type stubs (or incomplete stubs)
[[tool.mypy.overrides]]
module = [
    "yaml.*",
    "pypandoc.*",
    "weasyprint.*",
    "pypdf.*",
    "docx.*",
    "pandas.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "testcontainers.*",
]
ignore_missing_imports = true
disable_error_code = [
    "import-untyped",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*test*",
    "*__pycache__*",
    "*venv*",
    "*.venv*",
    "*migrations*",
    "*setup.py",
    "*__init__.py",
    "*dist-packages*",
    "*site-packages*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "raise ImportError",
    "if __name__ == .__main__.:",
    "pass",
    "if TYPE_CHECKING:",
    "@overload",
    "@abstractmethod",
    "@property",
    "@classmethod",
    "@staticmethod",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
pythonpath = [
    "src",
    ".",
    "runner",
]
python_files = "test_*.py *_test.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-s -v --durations=10 --log-cli-level=INFO --import-mode=importlib -m 'not (financial or slow or docker or simulation)'"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"

markers = [
    "financial: marks tests that incur real monetary costs via external API calls",
    "slow: marks tests as slow running",
    "simulation: marks expensive statistical scenario suites excluded from the default test run",
    "integration: marks tests requiring external services",
    "docker: marks tests that need docker compose setup",
    "e2e: marks tests as end-to-end pipeline tests",
    "unit: marks tests as unit tests for isolated component testing",
    "timeout: marks tests with specific timeout requirements",
]

filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::DeprecationWarning:testcontainers.*",
]

[tool.repository-governance]
schema-version = 3
repository = "skriptoteket"

[tool.repository-governance.owners]
service = ["skriptoteket"]

[tool.repository-governance.hemma]
host = "hemma"
repository-root = "/home/paunchygent/apps/skriptoteket"
forward-environment = []

[tool.repository-governance.setup]
projects = [
    { path = ".", groups = ["default", "monorepo-tools", "dev"] },
]

[tool.repository-governance.frontend]
workspace-yaml = "frontend/pnpm-workspace.yaml"
package-manager-manifest = "frontend/package.json"
dependency-manifests = [
    "frontend/package.json",
    "frontend/apps/skriptoteket/package.json",
]
resource-manifest = "frontend/apps/skriptoteket/src/design-system/huleedu-integrated/manifest.json"
resource-package = "frontend/apps/skriptoteket/src/design-system/huleedu-integrated/package.json"
justified-exceptions = []

[tool.repository-governance.quality]

[[tool.repository-governance.quality.projects]]
path = "."
format = ["."]
lint = ["."]
typecheck-diagnostic-producer = "backend-typecheck"
test-diagnostic-producer = "backend-test"

[[tool.repository-governance.quality.cohorts]]
name = "backend-source"
kind = "path"
path = "src"
typecheck = "backend-typecheck"

[[tool.repository-governance.quality.cohorts]]
name = "unit-domain"
kind = "component-root"
root = "tests/unit"
test-target = "component"
typecheck = "backend-typecheck"
test = "backend-test"

[[tool.repository-governance.quality.cohorts]]
name = "integration"
kind = "path"
path = "tests/integration"
typecheck = "backend-typecheck"
test = "backend-test"

[[tool.repository-governance.quality.cohorts]]
name = "frontend"
kind = "path"
path = "frontend"
typecheck = "frontend-typecheck"
test = "frontend-test"

[[tool.repository-governance.quality.producers]]
name = "backend-typecheck"
intent = "typecheck"
project = "."
command = "mypy"
arguments = ["--config-file", "pyproject.toml"]

[[tool.repository-governance.quality.producers]]
name = "backend-test"
intent = "test"
project = "."
command = "test-parallel"
arguments = []

[[tool.repository-governance.quality.producers]]
name = "frontend-typecheck"
intent = "typecheck"
project = "."
command = "fe-type-check"
arguments = []

[[tool.repository-governance.quality.producers]]
name = "frontend-test"
intent = "test"
project = "."
command = "fe-test"
arguments = []

[[tool.repository-governance.quality.validators]]
name = "docs-validate"
project = "."
command = "docs-validate"
arguments = []

[[tool.repository-governance.quality.validators]]
name = "skills-validate"
project = "."
command = "repository-governance-skills-validate"
arguments = []

[[tool.repository-governance.quality.validators]]
name = "handoff-validate"
project = "."
command = "repository-governance-handoff-validate"
arguments = []

[[tool.repository-governance.quality.validators]]
name = "bindings"
project = "."
command = "repository-governance-bindings"
arguments = ["check", "--project-file", "pyproject.toml"]

[tool.pdm]
distribution = false

[tool.pdm.scripts]
# repository-governance:bindings:start
setup = "pdm run --project ${HOME}/.codex/repository-governance-runtime cross-repo-worktree-bootstrap --repo-root ${PDM_PROJECT_ROOT}"
new-worktree = "pdm run --project ${HOME}/.codex/repository-governance-runtime cross-repo-worktree-create --repo-root ${PDM_PROJECT_ROOT}"
format = "repository-governance-routine format --repo-root ${PDM_PROJECT_ROOT}"
lint = "repository-governance-routine lint --repo-root ${PDM_PROJECT_ROOT}"
typecheck = "repository-governance-routine typecheck --repo-root ${PDM_PROJECT_ROOT}"
test = "repository-governance-routine test --repo-root ${PDM_PROJECT_ROOT}"
check = "repository-governance-routine check --repo-root ${PDM_PROJECT_ROOT}"
new-doc = "repository-governance-new-doc"
new-epic = "new-epic"
new-story = "new-story"
new-task = "new-task"
new-review = "new-review"
docs-sync = "repository-governance-docs-sync"
docs-validate = "repository-governance-docs-validate"
format-md = "format-md"
check-md = "check-md"
format-md-all = "format-md-all"
check-md-all = "check-md-all"
# repository-governance:bindings:end
# repository-governance:auxiliary-bindings:start
archive-documents = "repository-governance-archive-documents"
run-hemma = "repository-governance-run-hemma --repo-root ${PDM_PROJECT_ROOT}"
staleness-audit = "repository-governance-staleness-audit --repo-root ${PDM_PROJECT_ROOT}"
publish-main = "repository-governance-publish-main --repository-root ${PDM_PROJECT_ROOT}"
verify-main-publication = "repository-governance-verify-main-publication --repository-root ${PDM_PROJECT_ROOT}"
# repository-governance:auxiliary-bindings:end
# App runtime
dev = "uvicorn --app-dir src skriptoteket.web.app:app --reload --host 127.0.0.1 --port 8000"
dev-logs = "sh -c 'mkdir -p .artifacts && WATCHFILES_FORCE_POLLING=true WATCHFILES_POLL_DELAY_MS=300 pdm run dev 2>&1 | tee .artifacts/dev-backend.log'"
dev-local = "sh -c 'pdm run dev-logs & pdm run fe-dev-logs & wait'"
dev-docker = "uvicorn --app-dir src skriptoteket.web.app:app --reload --host 0.0.0.0 --port 8000"
serve = "uvicorn --app-dir src skriptoteket.web.app:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
backfill-classroom-share-previews = "sh -c 'PYTHONPATH=src:$PYTHONPATH python -m skriptoteket.cli backfill-classroom-share-previews \"$@\"' --"
ui-hmr-probe = "python -m scripts.playwright_hmr_probe"
pr-0252-auth-return = "python -m scripts.playwright_pr_0252_auth_return_to_origin"
pr-0253-auth-retirement = "python -m scripts.playwright_pr_0253_auth_retirement"
pr-0254-auth-cutover = "python -m scripts.playwright_pr_0254_auth_cutover"
auth-cutover-proof = "python -m scripts.playwright_pr_0254_auth_cutover"
pr-0255-auth-bootstrap = "python -m scripts.playwright_pr_0255_auth_bootstrap"
pr-0258-auth-projection = "python -m scripts.playwright_pr_0258_auth_projection"
pr-0261-auth-action-matrix = "python -m scripts.playwright_pr_0261_auth_action_matrix --start-backend --start-vite"
pr-0262-real-lifecycle = "python -m scripts.playwright_pr_0262_real_lifecycle --start-backend --start-vite"
transcript-parity-proof = "python -m scripts.transcript_parity_proof_launcher"
audio-transcription-reattempt-proof = "python -m scripts.audio_transcription_retryable_reattempt_public_proof"
openapi-export-v1 = "python -m scripts.export_openapi_v1"
fe-gen-api-types = { composite = [
    "python -m scripts.export_openapi_v1",
    "pnpm -C frontend --filter @skriptoteket/spa gen:api-types",
] }

# Frontend (full SPA; ADR-0027/ADR-0029)
fe-install.cmd = "pnpm install"
fe-install.working_dir = "frontend"

fe-dev.cmd = "pnpm --filter @skriptoteket/spa dev"
fe-dev.working_dir = "frontend"
fe-dev-shared-auth.cmd = "pnpm --filter @skriptoteket/spa dev"
fe-dev-shared-auth.working_dir = "frontend"
fe-dev-shared-auth.env = { VITE_DEV_PROXY_TARGET = "http://localhost:8080", VITE_DEV_BACKEND_PROXY_TARGET = "http://localhost:8000", VITE_DEV_PUBLIC_API_PROXY_TARGET = "http://localhost:8000", VITE_DEV_SIR_CONVERT_GATEWAY_PROXY_TARGET = "http://localhost:8080", VITE_HULEEDU_AUTH_BASE_URL = "http://localhost:8080", VITE_HULEEDU_AUTH_ENTRY_URL = "http://localhost:8080/auth/login" }
fe-dev-logs.cmd = "sh -c 'mkdir -p ../.artifacts && pnpm --filter @skriptoteket/spa dev 2>&1 | tee ../.artifacts/dev-frontend.log'"
fe-dev-logs.working_dir = "frontend"

fe-build.cmd = "pnpm --filter @skriptoteket/spa build"
fe-build.working_dir = "frontend"

fe-build-watch.cmd = "pnpm --filter @skriptoteket/spa build:watch"
fe-build-watch.working_dir = "frontend"

fe-preview.cmd = "pnpm --filter @skriptoteket/spa preview"
fe-preview.working_dir = "frontend"

fe-type-check.cmd = "pnpm --filter @skriptoteket/spa typecheck"
fe-type-check.working_dir = "frontend"

fe-lint.cmd = "pnpm --filter @skriptoteket/spa lint"
fe-lint.working_dir = "frontend"

fe-lint-fix.cmd = "pnpm --filter @skriptoteket/spa lint:fix"
fe-lint-fix.working_dir = "frontend"

fe-test.cmd = "pnpm --filter @skriptoteket/spa test"
fe-test.working_dir = "frontend"

fe-test-watch.cmd = "pnpm --filter @skriptoteket/spa test:watch"
fe-test-watch.working_dir = "frontend"

fe-test-coverage.cmd = "pnpm --filter @skriptoteket/spa test:coverage"
fe-test-coverage.working_dir = "frontend"

# Code quality
lint-fix = "ruff check --fix --force-exclude ."
shellcheck = "shellcheck"
shellcheck-all = 'find . -type f \( -name "*.sh" -o -name "*.bash" \) -not -path "./.git/*" -not -path "./.venv/*" -not -path "./node_modules/*" -not -path "./frontend/node_modules/*" -exec shellcheck {} +'

# Tests
test-parallel = "python -m scripts.run_pytest_with_native_libs -n auto"
test-sequential = "python -m scripts.run_pytest_with_native_libs -n 0"
test-simulations = "python -m scripts.run_pytest_with_native_libs -m simulation -s -v --durations=10 --log-cli-level=INFO --import-mode=importlib --override-ini addopts=''"

# Docs-as-code governance
handoff-validate = "python -m scripts.check_agent_doc_budgets"

# Hemma production operator commands
hemma-deploy = "bash ./scripts/hemma_deploy_start.sh"
hemma-deploy-monitor = "bash ./scripts/hemma_deploy_monitor.sh"
hemma-deploy-share-previews = "bash ./scripts/hemma_deploy_start.sh --script scripts/hemma_deploy_and_verify_share_previews.sh"
check-migration-test-coverage = "python -m scripts.check_migration_test_coverage"
sds-download-roth = "python -m scripts.download_reagent_prep_chef_sds_pdfs"
sds-build-shortcards = "python -m scripts.build_reagent_prep_chef_sds_shortcards"
sds-check-hazard-alignment = "python -m scripts.check_reagent_prep_chef_hazard_shortcard_alignment"
textbook-corpus-baseline = "python -m scripts.build_textbook_corpus_baseline"
textbook-corpus-mechanical = "python -m scripts.build_textbook_corpus_mechanical_cleanup"
textbook-corpus-manual = "python -m scripts.build_textbook_corpus_manual_restoration_workflow"

# Help content generation
generate-planner-help = "python -m scripts.generate_planner_help"

# Agent skills (repo-local)
skills-prompt = "python -m scripts.skills_prompt"
skills-validate = "python -m scripts.skills_prompt --validate"

# Dependency locking (multi-platform)
lock-multi = "pdm lock --platform macos_14_0_arm64 --platform manylinux_2_40_x86_64 --platform manylinux_2_41_aarch64"

# Database
db-upgrade = "alembic upgrade head"

# Admin bootstrap
bootstrap-superuser = { cmd = "python -m skriptoteket.cli bootstrap-superuser", env = { PYTHONPATH = "src" } }
provision-user = { cmd = "python -m skriptoteket.cli provision-user", env = { PYTHONPATH = "src" } }
consume-huleedu-subject-export = { cmd = "python -m skriptoteket.cli consume-huleedu-subject-export", env = { PYTHONPATH = "src" } }
auth-edge-bootstrap-preflight = { cmd = "python -m skriptoteket.cli auth-edge-bootstrap-preflight", env = { PYTHONPATH = "src" } }
send-feedback-emails = { cmd = "python -m skriptoteket.cli send-feedback-emails", env = { PYTHONPATH = "src" } }
artifacts-prune = { cmd = "python -m skriptoteket.cli prune-artifacts", env = { PYTHONPATH = "src" } }
cleanup-document-converter-project-previews = { cmd = "python -m skriptoteket.cli cleanup-document-converter-project-previews", env = { PYTHONPATH = "src" } }
cleanup-session-files = { cmd = "python -m skriptoteket.cli cleanup-session-files", env = { PYTHONPATH = "src" } }
cleanup-sandbox-snapshots = { cmd = "python -m skriptoteket.cli cleanup-sandbox-snapshots", env = { PYTHONPATH = "src" } }
clear-all-session-files = { cmd = "python -m skriptoteket.cli clear-all-session-files", env = { PYTHONPATH = "src" } }
seed-script-bank = { cmd = "python -m skriptoteket.cli seed-script-bank", env = { PYTHONPATH = "src" } }
run-execution-worker = { cmd = "python -m skriptoteket.cli run-execution-worker", env = { PYTHONPATH = "src" } }

# Docker dev workflow (compose base + dev overrides)
dev-stack = "python -m scripts.dev_stack"

# Observability stack (Prometheus, Grafana, Jaeger, Loki)
obs-stack = "python -m scripts.obs_stack"

# Pre-commit convenience
precommit-install = "pre-commit install"
precommit-run = "pre-commit run --all-files"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
