<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" class="w-full max-w-[10rem]">
  <!-- Room base -->
  <rect x="2" y="2" width="96" height="56" fill="none" stroke="#1c2e4a" stroke-width="2" />

  <!-- Static desks grid -->
  <g fill="#fafaf6" stroke="#1c2e4a" stroke-width="1.5">
    <rect x="12" y="16" width="16" height="10" />
    <rect x="32" y="16" width="16" height="10" />
    <rect x="52" y="16" width="16" height="10" />
    <rect x="72" y="16" width="16" height="10" />

    <rect x="12" y="32" width="16" height="10" />
    <rect x="32" y="32" width="16" height="10" />
    <!-- Dropping target (dashed) -->
    <rect x="52" y="32" width="16" height="10" fill="rgba(28,46,74,0.05)" stroke-dasharray="2 2" />
    <rect x="72" y="32" width="16" height="10" />
  </g>

  <!-- Floating/dragged student card -->
  <g transform="translate(62, 40) rotate(-8)">
    <!-- Shadow effect -->
    <rect x="2" y="2" width="18" height="12" fill="rgba(28,46,74,0.2)" />
    <!-- Main card -->
    <rect x="0" y="0" width="18" height="12" fill="#fafaf6" stroke="#1c2e4a" stroke-width="1.5" />
    <!-- Abstract text representing a student's name -->
    <line x1="4" y1="4" x2="14" y2="4" stroke="#1c2e4a" stroke-width="1" />
    <line x1="4" y1="8" x2="10" y2="8" stroke="#1c2e4a" stroke-width="1" />
  </g>

  <!-- Stylized pointer/mouse cursor dropping the card -->
  <path d="M 74 50 L 74 40 L 78 44 L 82 50 Z" fill="#1c2e4a" stroke="#fafaf6" stroke-width="1" />
</svg>
