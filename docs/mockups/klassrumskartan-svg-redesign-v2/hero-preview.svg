<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-label="Klassrumskarta i trådmodell">
  <style>
    :root {
      --color-navy: #1c2e4a;
      --font-mono: 'IBM Plex Mono', monospace;
      --font-sans: 'Inter', sans-serif;
    }
    .stroke-main { fill: none; stroke: var(--color-navy); stroke-width: 1.5; }
    .stroke-thick { fill: none; stroke: var(--color-navy); stroke-width: 2; }
    .stroke-dashed { fill: none; stroke: var(--color-navy); stroke-width: 1.5; stroke-dasharray: 3,3; }
    .stroke-grid { fill: none; stroke: var(--color-navy); stroke-width: 0.5; opacity: 0.15; }
    .text-tiny { font-family: var(--font-mono); font-size: 5px; font-weight: 600; fill: var(--color-navy); text-anchor: middle; letter-spacing: 1px; }
    .text-small { font-family: var(--font-sans); font-size: 6px; font-weight: 600; fill: var(--color-navy); text-anchor: middle; }
    .text-dim { fill-opacity: 0.4; }
  </style>

  <!-- Wireframe Grid Background -->
  <pattern id="hero-grid" width="10" height="10" patternUnits="userSpaceOnUse">
    <path d="M 10 0 L 0 0 0 10" class="stroke-grid" />
  </pattern>
  <rect width="100%" height="100%" fill="url(#hero-grid)" />

  <!-- Room Outline -->
  <rect x="20" y="20" width="280" height="180" class="stroke-thick" />
  <rect x="24" y="24" width="272" height="172" class="stroke-main" stroke-opacity="0.3" />

  <!-- Wall Fixtures -->
  <rect x="100" y="20" width="120" height="4" class="stroke-main" />
  <text x="160" y="15" class="text-tiny">WHITEBOARD</text>

  <rect x="20" y="70" width="4" height="40" class="stroke-main" />
  <text x="15" y="90" class="text-tiny" transform="rotate(-90, 15, 90)">DÖRR</text>

  <rect x="296" y="80" width="4" height="60" class="stroke-main" />
  <text x="305" y="110" class="text-tiny" transform="rotate(90, 305, 110)">FÖNSTER</text>

  <!-- Teacher Desk (Kateder) -->
  <rect x="50" y="40" width="40" height="20" rx="2" class="stroke-thick" />
  <text x="70" y="50" class="text-tiny" dy="0.3em">KATEDER</text>

  <!-- Row 1 Student Desks -->
  <g transform="translate(60, 85)">
    <rect x="0" y="0" width="60" height="12" rx="2" class="stroke-main" />
    <circle cx="15" cy="30" r="13" class="stroke-main" />
    <text x="15" y="30" class="text-small" dy="0.3em">Alva</text>
    <circle cx="45" cy="30" r="13" class="stroke-dashed" />
    <text x="45" y="30" class="text-tiny text-dim" dy="0.3em">TOM</text>
  </g>

  <g transform="translate(140, 85)">
    <rect x="0" y="0" width="60" height="12" rx="2" class="stroke-main" />
    <circle cx="15" cy="30" r="13" class="stroke-main" />
    <text x="15" y="30" class="text-small" dy="0.3em">Elliot</text>
    <circle cx="45" cy="30" r="13" class="stroke-main" />
    <text x="45" y="30" class="text-small" dy="0.3em">Freja</text>
  </g>

  <g transform="translate(220, 85)">
    <rect x="0" y="0" width="60" height="12" rx="2" class="stroke-main" />
    <circle cx="15" cy="30" r="13" class="stroke-dashed" />
    <text x="15" y="30" class="text-tiny text-dim" dy="0.3em">TOM</text>
    <circle cx="45" cy="30" r="13" class="stroke-dashed" />
    <text x="45" y="30" class="text-tiny text-dim" dy="0.3em">TOM</text>
  </g>

  <!-- Row 2 Student Desks -->
  <g transform="translate(60, 145)">
    <rect x="0" y="0" width="60" height="12" rx="2" class="stroke-main" />
    <circle cx="15" cy="30" r="13" class="stroke-dashed" />
    <text x="15" y="30" class="text-tiny text-dim" dy="0.3em">TOM</text>
    <circle cx="45" cy="30" r="13" class="stroke-main" />
    <text x="45" y="30" class="text-small" dy="0.3em">Hilda</text>
  </g>

  <g transform="translate(140, 145)">
    <rect x="0" y="0" width="60" height="12" rx="2" class="stroke-main" />
    <circle cx="15" cy="30" r="13" class="stroke-main" />
    <text x="15" y="30" class="text-small" dy="0.3em">Lucas</text>
    <circle cx="45" cy="30" r="13" class="stroke-main" />
    <text x="45" y="30" class="text-small" dy="0.3em">Nora</text>
  </g>

  <g transform="translate(220, 145)">
    <rect x="0" y="0" width="60" height="12" rx="2" class="stroke-main" />
    <circle cx="15" cy="30" r="13" class="stroke-main" />
    <text x="15" y="30" class="text-small" dy="0.3em">Agnes</text>
    <circle cx="45" cy="30" r="13" class="stroke-dashed" />
    <text x="45" y="30" class="text-tiny text-dim" dy="0.3em">TOM</text>
  </g>
</svg>
