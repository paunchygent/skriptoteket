<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" class="w-full max-w-[10rem]">
  <style>
    .stroke-main { fill: none; stroke: #1c2e4a; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .stroke-dashed { fill: none; stroke: #1c2e4a; stroke-width: 1.5; stroke-dasharray: 2,2; stroke-linecap: round; stroke-linejoin: round; }
    .stroke-thick { fill: none; stroke: #1c2e4a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Source Desk (representing picking an item from the toolbar) -->
  <g class="stroke-main">
    <rect x="40" y="4" width="20" height="4" rx="1" />
    <circle cx="45" cy="12" r="2.5" />
    <circle cx="55" cy="12" r="2.5" />
  </g>

  <!-- Action Arrow passing through the opening -->
  <line x1="50" y1="17" x2="50" y2="31" class="stroke-main" />
  <polyline points="46,27 50,32 54,27" class="stroke-main" />

  <!-- Room Boundary with an intentional gap so the arrow doesn't intersect the wall -->
  <path d="M 10 25 L 43 25 M 57 25 L 90 25 L 90 55 L 10 55 Z" class="stroke-thick" />

  <!-- Target Desk inside the Room (dashed to show it's being placed) -->
  <g class="stroke-dashed">
    <rect x="40" y="37" width="20" height="4" rx="1" />
    <circle cx="45" cy="45" r="2.5" />
    <circle cx="55" cy="45" r="2.5" />
  </g>
</svg>
