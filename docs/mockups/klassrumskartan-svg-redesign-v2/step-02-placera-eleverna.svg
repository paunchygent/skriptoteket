<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" class="w-full max-w-[10rem]">
  <style>
    .stroke-main { fill: none; stroke: #1c2e4a; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .stroke-dashed { fill: none; stroke: #1c2e4a; stroke-width: 1.5; stroke-dasharray: 2,2; stroke-linecap: round; stroke-linejoin: round; }
    .stroke-thick { fill: none; stroke: #1c2e4a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Left: A Student Card (Entity A) -->
  <rect x="10" y="22" width="34" height="16" rx="2" class="stroke-thick" />

  <!-- Mini Person Icon (head + shoulders path) inside the card -->
  <circle cx="18" cy="27" r="2.5" class="stroke-main" />
  <path d="M 14 34 C 14 31, 22 31, 22 34" class="stroke-main" />

  <!-- "Name" line -->
  <line x1="26" y1="30" x2="38" y2="30" class="stroke-main" />

  <!-- Middle: Action Arrow mapping the card to the seat -->
  <line x1="48" y1="30" x2="66" y2="30" class="stroke-main" />
  <polyline points="62,26 67,30 62,34" class="stroke-main" />

  <!-- Right: Target Desk & Empty Target Seat (Entity B) -->
  <rect x="70" y="15" width="20" height="4" rx="1" class="stroke-main" />
  <circle cx="80" cy="30" r="7" class="stroke-dashed" />
</svg>
