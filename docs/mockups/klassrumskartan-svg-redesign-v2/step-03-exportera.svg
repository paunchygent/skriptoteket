<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" class="w-full max-w-[10rem]">
  <style>
    .stroke-main { fill: none; stroke: #1c2e4a; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .stroke-thick { fill: none; stroke: #1c2e4a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .text-bold { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 700; fill: #1c2e4a; text-anchor: middle; letter-spacing: 1px; }
  </style>

  <!-- Large, minimal Document Shape with folded corner -->
  <path d="M 35 6 L 55 6 L 65 16 L 65 54 L 35 54 Z" class="stroke-thick" />

  <!-- Folded corner edge connecting to the document -->
  <polyline points="55,6 55,16 65,16" class="stroke-main" />

  <!-- Clean, bold text inside -->
  <text x="50" y="35" class="text-bold">PDF</text>
</svg>
