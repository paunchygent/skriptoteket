<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" class="w-full max-w-[10rem]">
  <style>
    .stroke-thick { fill: none; stroke: #1c2e4a; stroke-width: 2; shape-rendering: crispEdges; }
    .stroke-main { fill: none; stroke: #1c2e4a; stroke-width: 1.5; shape-rendering: crispEdges; }
    .stroke-dashed { fill: none; stroke: #1c2e4a; stroke-width: 1.5; stroke-dasharray: 2,2; shape-rendering: crispEdges; }
  </style>

  <!-- Left Side: Sharp Sidebar representing the student list -->
  <rect x="5" y="10" width="25" height="40" class="stroke-thick" />

  <!-- Name slots in the list (sharp lines) -->
  <line x1="10" y1="18" x2="25" y2="18" class="stroke-main" />
  <line x1="10" y1="28" x2="25" y2="28" class="stroke-main" />
  <!-- Line 3 is missing, representing the student currently being placed -->

  <!-- Right Side: Sharp Room Boundary -->
  <rect x="40" y="10" width="55" height="40" class="stroke-thick" />

  <!-- Sharp Desk inside room -->
  <rect x="50" y="20" width="30" height="6" class="stroke-main" />

  <!-- Target Seat (the only circle allowed, representing the actual seat shape) -->
  <circle cx="65" cy="38" r="5" class="stroke-dashed" />

  <!-- The student being placed: a stark, sharp rectangle -->
  <rect x="35" y="36" width="15" height="4" class="stroke-main" />

  <!-- Perfect straight horizontal line indicating placement path (no curves, no arrows) -->
  <line x1="25" y1="38" x2="35" y2="38" class="stroke-dashed" />
  <line x1="50" y1="38" x2="60" y2="38" class="stroke-dashed" />
</svg>
