<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" class="w-full max-w-[10rem]">
  <style>
    .stroke-thick { fill: none; stroke: #1c2e4a; stroke-width: 2; shape-rendering: crispEdges; }
    .stroke-main { fill: none; stroke: #1c2e4a; stroke-width: 1.5; shape-rendering: crispEdges; }
    .stroke-dashed { fill: none; stroke: #1c2e4a; stroke-width: 1.5; stroke-dasharray: 2,2; shape-rendering: crispEdges; }
  </style>

  <!-- Strict sharp bounding box for the room -->
  <rect x="10" y="10" width="80" height="40" class="stroke-thick" />

  <!-- Minimalist physical fixtures (door, whiteboard) -->
  <rect x="30" y="10" width="40" height="3" class="stroke-main" />
  <rect x="10" y="20" width="3" height="20" class="stroke-main" />

  <!-- Creating an object: A sharp straight-line crosshair generating a bounding box -->
  <rect x="50" y="25" width="25" height="15" class="stroke-dashed" />

  <!-- Perfectly horizontal and vertical lines for a sharp crosshair -->
  <line x1="75" y1="40" x2="85" y2="40" class="stroke-main" />
  <line x1="80" y1="35" x2="80" y2="45" class="stroke-main" />
</svg>
