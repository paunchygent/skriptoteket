<header class="topbar" id="topbar">
  <button class="btn icon ghost desk-only" id="b-rail" aria-pressed="false" title="Fäll ihop menyn" aria-label="Fäll ihop menyn"><svg class="g"><use href="#i-panel-left"/></svg></button>
  <a class="brand" href="#" id="brand">Skriptoteket<small id="brand-app">Provredigering</small></a>
  <div class="tb-slot" id="tb-slot"></div>
  <span class="grow"></span>
  <button class="btn ghost tb-link" id="b-help" title="Hjälp" aria-label="Hjälp" aria-haspopup="dialog" aria-expanded="false"><svg class="g"><use href="#i-circle-question-mark"/></svg><span class="tb-word">Hjälp</span></button>
  <button class="btn ghost tb-link" id="b-logout" title="Logga ut" aria-label="Logga ut"><svg class="g"><use href="#i-log-out"/></svg><span class="tb-word">Logga ut</span></button>
  <button class="btn icon ghost phone-only" id="b-nav" aria-label="Meny" title="Meny" aria-expanded="false" aria-controls="sidebar"><svg class="g"><use href="#i-menu"/></svg></button>
</header>

<nav class="sidebar" id="sidebar" aria-label="Huvudmeny">
  <div class="nav-head phone-only"><span class="brand sm">Skriptoteket</span><button class="btn icon ghost" id="b-nav-close" aria-label="Stäng menyn" title="Stäng menyn"><svg class="g"><use href="#i-x"/></svg></button></div>
  <div class="nav-items" id="nav-items"></div>
  <div class="nav-foot phone-only">
    <span class="nav-user">olof.larsson@skola.se</span>

  </div>
</nav>
<div class="nav-backdrop" id="nav-backdrop"></div>

<main class="page" id="page">
  <!-- Exam workspace: fills the page frame edge to edge -->
  <section class="ws" id="ws" aria-label="Provredigering">
    <div class="wshead" id="wshead">
      <div class="titleblock" id="titleblock">
        <button class="examtitle" id="b-title" aria-haspopup="dialog" aria-expanded="false" title="Provets uppgifter"><span class="tx" id="title-text"></span><svg class="g sm"><use href="#i-chevron-down"/></svg></button>
        <div class="meta" id="meta"></div>
      </div>
      <div class="toolbar" role="toolbar" aria-label="Provet" id="toolbar">
        <div class="group" role="group" aria-label="Fil">
          <button class="btn" id="b-open" aria-expanded="false" title="Öppna eller importera ett prov"><svg class="g"><use href="#i-folder-open"/></svg><span class="word">Öppna</span></button>
          <div class="split" id="save-split">
            <button class="btn primary" id="b-save"><svg class="g"><use href="#i-save"/></svg>Spara</button>
            <button class="btn primary icon chev" id="b-save-menu" aria-haspopup="menu" aria-expanded="false" title="Fler sätt att spara" aria-label="Fler sätt att spara"><svg class="g sm"><use href="#i-chevron-down"/></svg></button>
          </div>
          <button class="btn" id="b-export" aria-haspopup="menu" aria-expanded="false" title="Exportera provet"><svg class="g"><use href="#i-download"/></svg><span class="word">Exportera</span><svg class="g sm word"><use href="#i-chevron-down"/></svg></button>
        </div>
        <span class="sep"></span>
        <button class="btn icon" id="b-ai-all" title="Föreslå facit för frågor som saknar facit" aria-label="Föreslå facit för frågor som saknar facit"><svg class="g" id="ai-all-glyph"><use href="#i-sparkles"/></svg></button>
        <span class="sep"></span>
        <div class="group" role="group" aria-label="Historik">
          <button class="btn icon" id="b-undo" title="Ångra (Ctrl+Z)" aria-label="Ångra" aria-keyshortcuts="Control+Z Meta+Z"><svg class="g"><use href="#i-undo-2"/></svg></button>
          <button class="btn icon" id="b-redo" title="Gör om (Ctrl+Shift+Z)" aria-label="Gör om" aria-keyshortcuts="Control+Shift+Z Meta+Shift+Z"><svg class="g"><use href="#i-redo-2"/></svg></button>
        </div>
      </div>
    </div>

    <div class="strip phone-only" id="strip">
      <div class="stripnav"><button id="p-prev" aria-label="Föregående fråga" title="Föregående fråga"><svg class="g"><use href="#i-chevron-left"/></svg></button>
        <button id="p-pick" aria-haspopup="dialog" title="Välj fråga"><span id="p-state"></span><span id="p-pos"></span><svg class="g sm"><use href="#i-chevron-down"/></svg></button>
        <button id="p-next" aria-label="Nästa fråga" title="Nästa fråga"><svg class="g"><use href="#i-chevron-right"/></svg></button></div>
      <span class="phone-tools" id="phone-tools"></span>
    </div>

    <div class="body" id="body">
      <section class="list" id="list" aria-label="Frågor">
        <div class="listhead"><button class="btn back phone-only" id="list-back"><svg class="g"><use href="#i-arrow-left"/></svg>Tillbaka</button><h2 id="list-count"></h2>
          <button class="btn compact" id="b-new" aria-haspopup="menu" aria-expanded="false"><svg class="g sm"><use href="#i-plus"/></svg>Ny uppgift</button></div>
        <div class="rows" id="rows" aria-keyshortcuts="ArrowUp ArrowDown"></div>
        <div class="listfoot" id="listfoot"></div>
      </section>

      <section class="editor" id="editor" aria-label="Fråga"></section>

      <aside class="drawer" id="d-open" hidden aria-label="Öppna">
        <div class="drawerhead"><button class="btn back" data-close><svg class="g"><use href="#i-arrow-left"/></svg>Tillbaka</button><h2>Öppna</h2><button class="btn icon ghost close-x" data-close title="Stäng" aria-label="Stäng"><svg class="g"><use href="#i-x"/></svg></button></div>
        <div class="drawerbody" id="open-body"></div>
      </aside>
      <aside class="drawer" id="d-export" hidden aria-label="Exportera">
        <div class="drawerhead"><button class="btn back" data-close><svg class="g"><use href="#i-arrow-left"/></svg>Tillbaka</button><h2>Exportera</h2><button class="btn icon ghost close-x" data-close title="Stäng" aria-label="Stäng"><svg class="g"><use href="#i-x"/></svg></button></div>
        <div class="drawerbody" id="export-body"></div>
      </aside>
      <aside class="drawer" id="d-meta" hidden aria-label="Provets uppgifter">
        <div class="drawerhead"><button class="btn back" data-close><svg class="g"><use href="#i-arrow-left"/></svg>Tillbaka</button><h2>Provets uppgifter</h2><button class="btn icon ghost close-x" data-close title="Stäng" aria-label="Stäng"><svg class="g"><use href="#i-x"/></svg></button></div>
        <div class="drawerbody" id="meta-body"></div>
      </aside>
    </div>
  </section>

  <!-- Every other screen keeps its own layout inside this plain page frame (R3, R20) -->
  <section class="plain" id="plain" hidden></section>
</main>

<!-- Floating layers -->
<div class="menu" id="m-export" role="menu" hidden></div>
<div class="menu" id="m-save" role="menu" hidden>
  <button class="mi" data-act="save" role="menuitem"><svg class="g"><use href="#i-save"/></svg><span class="grow">Spara</span><kbd class="kbd" data-kbd="S"></kbd></button>
  <button class="mi" data-act="saveas" role="menuitem"><svg class="g"><use href="#i-copy"/></svg><span class="grow">Spara som …</span></button>
</div>
<div class="menu" id="m-new" role="menu" hidden></div>
