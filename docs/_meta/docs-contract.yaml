version: 1

# Only these top-level folders may exist under docs/
allowed_top_level:
  - adr
  - prd
  - releases
  - backlog
  - runbooks
  - reference
  - guides
  - mockups
  - templates
  - _meta

# Files that may omit frontmatter (exact paths, repo-relative)
frontmatter_exempt:
  - docs/index.md
  - docs/README.md
  - docs/mockups/INDEX.md
  - docs/_meta/README.md

frontmatter:
  delimiters: ["---", "---"]
  common_required:
    - type
    - id
    - title
    - status
    - owners
    - created
  common_optional:
    - updated
    - tags
    - links
    - approval_protocol
    - approval_evidence
    - approval_note

types:
  template:
    folder: docs/templates
    filename_regex: "^template-[a-z0-9-]+\\.md$"
    id_regex: "^TPL-[a-z0-9-]+$"
    status_allowed: ["active", "deprecated"]
    required: ["for_type"]
    optional: []

  sprint:
    folder: docs/backlog/sprints
    filename_regex: "^sprint-\\d{4}-\\d{2}-\\d{2}-[a-z0-9-]+\\.md$"
    id_regex: "^SPR-\\d{4}-\\d{2}-\\d{2}$"
    status_allowed: ["deprecated"]
    required: ["starts", "ends", "objective", "stories"]
    optional: ["prd", "epics", "adrs"]

  adr:
    folder: docs/adr
    filename_regex: "^adr-\\d{4}-[a-z0-9-]+\\.md$"
    id_regex: "^ADR-\\d{4}$"
    status_allowed: ["proposed", "accepted", "superseded", "deprecated"]
    required: ["deciders"]
    optional: ["context", "decision", "consequences", "supersedes", "superseded_by"]

  prd:
    folder: docs/prd
    filename_regex: "^prd-[a-z0-9-]+-v\\d+\\.\\d+(?:\\.\\d+)?\\.md$"
    id_regex: "^PRD-[a-z0-9-]+-v\\d+\\.\\d+(?:\\.\\d+)?$"
    status_allowed: ["draft", "active", "superseded"]
    required: ["product", "version"]
    optional: ["goals", "non_goals", "metrics"]

  release:
    folder: docs/releases
    filename_regex: "^release-[a-z0-9-]+-v\\d+\\.\\d+(?:\\.\\d+)?\\.md$"
    id_regex: "^REL-[a-z0-9-]+-v\\d+\\.\\d+(?:\\.\\d+)?$"
    status_allowed: ["draft", "published", "superseded"]
    required: ["product", "version"]
    optional: ["released"]

  epic:
    folder: docs/backlog/epics
    filename_regex: "^epic-\\d{2}-[a-z0-9-]+\\.md$"
    id_regex: "^EPIC-\\d{2}$"
    status_allowed: ["proposed", "active", "done", "dropped"]
    required: ["outcome"]
    optional: ["risks", "dependencies"]

  story:
    folder: docs/backlog/stories
    filename_regex: "^story-\\d{2}-\\d{2}-[a-z0-9-]+\\.md$"
    id_regex: "^ST-\\d{2}-\\d{2}$"
    status_allowed: ["ready", "in_progress", "done", "blocked", "canceled"]
    required: ["epic", "acceptance_criteria"]
    optional: ["ui_impact", "data_impact", "risks", "dependencies"]

  pr:
    folder: docs/backlog/prs
    filename_regex: "^pr-\\d{4}-[a-z0-9-]+\\.md$"
    id_regex: "^PR-\\d{4}$"
    status_allowed: ["ready", "in_progress", "done", "blocked", "canceled"]
    required: ["stories", "acceptance_criteria"]
    optional: ["adrs", "scope", "risks", "dependencies"]

  runbook:
    folder: docs/runbooks
    filename_regex: "^runbook-[a-z0-9-]+\\.md$"
    id_regex: "^RUN-[a-z0-9-]+$"
    status_allowed: ["active", "deprecated"]
    required: ["system"]
    optional: ["alerts", "steps", "rollback"]

  reference:
    folder: docs/reference
    filename_regex: "^ref-[a-z0-9-]+\\.md$"
    id_regex: "^REF-[a-z0-9-]+$"
    status_allowed: ["active", "deprecated"]
    required: ["topic"]
    optional: ["examples"]

  review:
    folder: docs/backlog/reviews
    filename_regex: "^review-[a-z0-9-]+\\.md$"
    id_regex: "^REV-(EPIC-\\d{2}|ST-\\d{2}-\\d{2}|PR-\\d{4})$"
    status_allowed: ["pending", "approved", "changes_requested", "rejected"]
    required: ["reviewer"]
    optional: ["epic", "stories", "prs", "adrs"]

  guide:
    folder: docs/guides
    filename_regex: "^guide-[a-z0-9-]+\\.md$"
    id_regex: "^GUIDE-[a-z0-9-]+$"
    status_allowed: ["active", "deprecated"]
    required: ["topic"]
    optional: []

  mockup:
    folder: docs/mockups
    filename_regex: "^(README|INDEX|[a-z0-9-]+)\\.md$"
    id_regex: "^MOCK-[a-z0-9-]+$"
    status_allowed: ["proposed", "approved", "superseded", "archived"]
    required: ["summary"]
    optional: ["canonical_preview", "submission_policy", "winner_policy"]

  codemap:
    folder: docs/reference/reports/codemaps
    filename_regex: "^[a-z0-9-]+\\.md$"
    id_regex: "^MAP-[a-z0-9-]+$"
    status_allowed: ["active", "deprecated"]
    required: ["topic"]
    optional: ["links"]

mockup_resources:
  folder: docs/mockups
  policy: "Non-Markdown files under docs/mockups are design/proofing resources, not docs frontmatter records."
  enforcement: "Markdown files are contract-validated; non-Markdown resource files are intentionally permissive."
  allowed_resource_examples:
    - ".html"
    - ".css"
    - ".js"
    - ".ts"
    - ".mjs"
    - ".json"
    - ".svg"
    - ".png"
    - ".jpg"
    - ".jpeg"
    - ".gif"
    - ".webp"
    - ".avif"
    - ".ico"
    - ".woff"
    - ".woff2"
    - ".ttf"
    - ".otf"
    - ".txt"
    - ".md"
  note: "The examples are intentionally broad and not a closed allowlist; the folder is a creative test, contest, and proofing ground."
