# Secrets overlay for compose.observability.yaml (project
# skriptoteket-observability).
#
# The ${VAR:?...} guard below fails any compose verb that loads this file while
# VAR is unset or empty, so ps, logs, stop and other non-up paths run on
# compose.observability.yaml alone and never read a secret. Pass this file only
# on up/run paths, wrapped so the secret reaches the command's environment:
#
#   agent-secrets run --set skriptoteket-prod -- \
#     sudo --preserve-env="$AGENT_SECRETS_VARIABLES" docker compose \
#     -f compose.observability.yaml -f compose.secrets.observability.yaml <verb>
---
services:
  grafana:
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?run through agent-secrets run --set skriptoteket-prod}
