<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60">
  <style>
    .doc { fill: none; stroke: #1c2e4a; stroke-width: 2; shape-rendering: crispEdges; }
    .fold { fill: none; stroke: #1c2e4a; stroke-width: 1; shape-rendering: crispEdges; }
    .mini-room { fill: none; stroke: #1c2e4a; stroke-width: 0.7; stroke-opacity: 0.35; shape-rendering: crispEdges; }
    .mini-seat { fill: #1c2e4a; fill-opacity: 0.25; stroke: none; }
    .mini-desk { fill: none; stroke: #1c2e4a; stroke-width: 0.5; stroke-opacity: 0.3; shape-rendering: crispEdges; }
    .text-label {
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      font-weight: 700;
      fill: #1c2e4a;
      text-anchor: middle;
      letter-spacing: 1px;
    }
    .text-sub {
      font-family: "IBM Plex Mono", monospace;
      font-size: 3.5px;
      font-weight: 600;
      fill: #1c2e4a;
      fill-opacity: 0.35;
      text-anchor: middle;
      letter-spacing: 0.5px;
    }
  </style>

  <path d="M 25 4 L 49 4 L 59 14 L 59 54 L 25 54 Z" class="doc" />
  <polyline points="49,4 49,14 59,14" class="fold" />

  <rect x="30" y="20" width="24" height="14" class="mini-room" />

  <rect x="32" y="23" width="8" height="1.5" class="mini-desk" />
  <rect x="44" y="23" width="8" height="1.5" class="mini-desk" />

  <circle cx="34" cy="28" r="1.5" class="mini-seat" />
  <circle cx="38" cy="28" r="1.5" class="mini-seat" />
  <circle cx="46" cy="28" r="1.5" class="mini-seat" />
  <circle cx="50" cy="28" r="1.5" class="mini-seat" />

  <line x1="30" y1="38" x2="54" y2="38" stroke="#1c2e4a" stroke-width="0.6" stroke-opacity="0.2" />
  <line x1="30" y1="42" x2="48" y2="42" stroke="#1c2e4a" stroke-width="0.6" stroke-opacity="0.2" />

  <text x="78" y="34" class="text-label">PDF</text>
  <text x="78" y="42" class="text-sub">EXPORT</text>
</svg>
