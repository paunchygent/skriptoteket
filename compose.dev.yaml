# Development overrides (hot-reload + volume mounts)
# Usage: docker compose -f compose.yaml -f compose.dev.yaml up

services:
  web:
    build:
      context: .
      target: development
    volumes:
      - ./src:/app/src:cached
      - ./migrations:/app/migrations:cached
      - ./alembic.ini:/app/alembic.ini:cached
      - ./.artifacts:/var/lib/skriptoteket/artifacts:cached
      - ./.artifacts/reagent_prep_chef/sds_pdfs:/var/lib/skriptoteket/reagent_prep_chef/sds_pdfs:cached
      - ./.vault:/var/lib/skriptoteket/vault:cached
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - ENVIRONMENT=development
      - ENABLE_DOCS=true
      - COOKIE_SECURE=false
      # Default dockerized dev uses the same Hemma Sir Convert v2 public lane as
      # production. Only override this in `.env` when explicitly debugging a
      # local CPU-only Docker converter profile on the MacBook.
      - SIR_CONVERT_A_LOT_V2_BASE_URL=${SIR_CONVERT_A_LOT_V2_BASE_URL:-https://convert.hule.education}
      - SIR_CONVERT_A_LOT_V2_API_KEY=${SIR_CONVERT_A_LOT_V2_API_KEY:-}
      - SIR_CONVERT_A_LOT_V2_CALLBACK_BASE_URL=${SIR_CONVERT_A_LOT_V2_CALLBACK_BASE_URL:-}
      - SIR_CONVERT_A_LOT_V2_CLASS_LIST_IMPORT_PDF_BACKEND_STRATEGY=${SIR_CONVERT_A_LOT_V2_CLASS_LIST_IMPORT_PDF_BACKEND_STRATEGY:-pymupdf}
      - SIR_CONVERT_A_LOT_V2_CLASS_LIST_IMPORT_ACCELERATION_POLICY=${SIR_CONVERT_A_LOT_V2_CLASS_LIST_IMPORT_ACCELERATION_POLICY:-cpu_only}
      # Ensure container uses the mounted artifacts dir (avoids relying on host-dev `.env` defaults like `/tmp/...`).
      - ARTIFACTS_ROOT=/var/lib/skriptoteket/artifacts
      - VAULT_ROOT=/var/lib/skriptoteket/vault
      - WATCHFILES_FORCE_POLLING=true
      - WATCHFILES_POLL_DELAY_MS=300
  worker:
    volumes:
      - ./src:/app/src:cached
      - ./.artifacts:/var/lib/skriptoteket/artifacts:cached
      - ./.vault:/var/lib/skriptoteket/vault:cached
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - ENVIRONMENT=development
      # Keep worker runtime on the same canonical Sir Convert v2 env contract as
      # web. Default to the Hemma public lane unless `.env` explicitly points at
      # a local CPU-only Docker converter profile.
      - SIR_CONVERT_A_LOT_V2_BASE_URL=${SIR_CONVERT_A_LOT_V2_BASE_URL:-https://convert.hule.education}
      - SIR_CONVERT_A_LOT_V2_API_KEY=${SIR_CONVERT_A_LOT_V2_API_KEY:-}
      - SIR_CONVERT_A_LOT_V2_CALLBACK_BASE_URL=${SIR_CONVERT_A_LOT_V2_CALLBACK_BASE_URL:-}
      - SIR_CONVERT_A_LOT_V2_CLASS_LIST_IMPORT_PDF_BACKEND_STRATEGY=${SIR_CONVERT_A_LOT_V2_CLASS_LIST_IMPORT_PDF_BACKEND_STRATEGY:-pymupdf}
      - SIR_CONVERT_A_LOT_V2_CLASS_LIST_IMPORT_ACCELERATION_POLICY=${SIR_CONVERT_A_LOT_V2_CLASS_LIST_IMPORT_ACCELERATION_POLICY:-cpu_only}
      # Ensure container uses the mounted artifacts dir (avoids relying on host-dev `.env` defaults like `/tmp/...`).
      - ARTIFACTS_ROOT=/var/lib/skriptoteket/artifacts
      - VAULT_ROOT=/var/lib/skriptoteket/vault
  frontend:
    environment:
      - VITE_DEV_POLLING=true
      - VITE_DEV_POLLING_INTERVAL=200
