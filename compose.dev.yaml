# Development overrides (hot-reload + volume mounts)
# Usage: docker compose -f compose.yaml -f compose.dev.yaml up

services:
  web:
    build:
      context: .
      target: development
    volumes:
      - ./src:/app/src:cached
      - ./migrations:/app/migrations:cached
      - ./alembic.ini:/app/alembic.ini:cached
      - ./.artifacts:/var/lib/skriptoteket/artifacts:cached
      - ./.artifacts/reagent_prep_chef/sds_pdfs:/var/lib/skriptoteket/reagent_prep_chef/sds_pdfs:cached
      - ./.vault:/var/lib/skriptoteket/vault:cached
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - ENVIRONMENT=development
      - ENABLE_DOCS=true
      - COOKIE_SECURE=false
      # Local PDF export lane: Docker web reaches the host-run Sir Convert
      # service, which calls back through the backend's published host port.
      - SIR_CONVERT_A_LOT_V2_BASE_URL=http://host.docker.internal:8085
      - SIR_CONVERT_A_LOT_V2_API_KEY=${SIR_CONVERT_A_LOT_V2_API_KEY:-${SIR_CONVERT_A_LOT_API_KEY:-}}
      - SIR_CONVERT_A_LOT_V2_CALLBACK_BASE_URL=http://127.0.0.1:8000
      # Ensure container uses the mounted artifacts dir (avoids relying on host-dev `.env` defaults like `/tmp/...`).
      - ARTIFACTS_ROOT=/var/lib/skriptoteket/artifacts
      - VAULT_ROOT=/var/lib/skriptoteket/vault
      - WATCHFILES_FORCE_POLLING=true
      - WATCHFILES_POLL_DELAY_MS=300
  worker:
    volumes:
      - ./src:/app/src:cached
      - ./.artifacts:/var/lib/skriptoteket/artifacts:cached
      - ./.vault:/var/lib/skriptoteket/vault:cached
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - ENVIRONMENT=development
      # Ensure container uses the mounted artifacts dir (avoids relying on host-dev `.env` defaults like `/tmp/...`).
      - ARTIFACTS_ROOT=/var/lib/skriptoteket/artifacts
      - VAULT_ROOT=/var/lib/skriptoteket/vault
  frontend:
    environment:
      - VITE_DEV_POLLING=true
      - VITE_DEV_POLLING_INTERVAL=200
